# =============================================================================
# CareerPilot — Render Blueprint (render.yaml)
# 100% Free Tier Configuration (Zero Payment / No Credit Card Required)
#
# Services defined here:
#   1. careerpilot-backend   — FastAPI (Python/Docker)  → Web Service (Free)
#   2. careerpilot-worker    — BullMQ (Node.js/Docker)  → Web Service (Free)
#   3. careerpilot-frontend  — React (Static Site)      → Static Site (Free)
#
# External free-tier services (configured via environment variables):
#   • NeonDB (Serverless PostgreSQL) — permanent free tier
#   • Upstash Redis (Serverless)      — 10,000 free commands/day
#   • Cloudinary                     — free storage tier
#
# Deploy: Push to GitHub → Render dashboard → "New Blueprint" → point to this file
# =============================================================================

services:
  # ===========================================================================
  # [1] FastAPI Backend — Python Web Service (100% Free Plan)
  # ===========================================================================
  - type: web
    name: careerpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore          # Match the region closest to NeonDB ap-southeast-1
    plan: free                 # Free tier (512MB RAM, sleeps after 15m inactivity)
    branch: main
    healthCheckPath: /healthz

    envVars:
      # ── App ────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CareerPilot
      - key: APP_VERSION
        value: 3.0.0
      - key: PORT
        value: "8000"

      # ── NeonDB (PostgreSQL) ─────────────────────────────────
      # Set this in Render dashboard → Environment → Secret
      - key: DATABASE_URL
        sync: false            # Set in dashboard: postgresql+asyncpg://...neon.tech/neondb

      # ── Google Gemini ───────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false            # Set in dashboard
      - key: GEMINI_LLM_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIM
        value: "768"

      # ── JWT Auth ────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false            # Generate: openssl rand -hex 32
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"

      # ── CORS ────────────────────────────────────────────────
      # Update after deploying frontend — set to the Static Site URL
      - key: CORS_ORIGINS
        sync: false            # e.g. https://careerpilot.onrender.com

      # ── BullMQ Worker URL ───────────────────────────────────
      # Set AFTER deploying the worker service below
      - key: WORKER_SERVICE_URL
        sync: false            # e.g. https://careerpilot-worker.onrender.com

      # ── Cloudinary (resume file storage) ───────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── File uploads ────────────────────────────────────────
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

  # ===========================================================================
  # [2] Node.js BullMQ Worker — Deployed as Web Service on Free Plan
  #     (Note: Render "type: worker" requires paid Starter plan, but deploying
  #      as "type: web" with health check runs the worker for FREE)
  # ===========================================================================
  - type: web
    name: careerpilot-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    region: singapore
    plan: free                 # Free tier (512MB RAM)
    branch: main
    healthCheckPath: /health

    envVars:
      # ── App Port ───────────────────────────────────────────
      - key: PORT
        value: "3001"
      - key: WORKER_PORT
        value: "3001"

      # ── Google Gemini ───────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_LLM_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIM
        value: "768"

      # ── NeonDB (PostgreSQL) ─────────────────────────────────
      # Node.js uses sync pg driver (no asyncpg prefix needed)
      - key: DATABASE_URL
        sync: false            # Set in dashboard: postgresql://...neon.tech/neondb

      # ── Upstash Redis ───────────────────────────────────────
      # Upstash provides a single REDIS_URL with TLS
      - key: REDIS_URL
        sync: false            # e.g. rediss://default:password@...upstash.io:6380
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6380"          # Upstash TLS port
      - key: REDIS_PASSWORD
        sync: false

      # ── Backend callback ────────────────────────────────────
      # Set to the backend Web Service URL after it's deployed
      - key: API_BASE_URL
        sync: false            # e.g. https://careerpilot-backend.onrender.com

  # ===========================================================================
  # [3] React Frontend — Static Site (Always Free)
  # ===========================================================================
  - type: web
    name: careerpilot-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    branch: main
    pullRequestPreviewsEnabled: false

    headers:
      # Cache static assets aggressively, HTML never
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Set to the deployed backend Web Service URL
      - key: VITE_API_URL
        sync: false            # e.g. https://careerpilot-backend.onrender.com
      - key: VITE_WS_URL
        sync: false            # Same URL (Socket.IO) e.g. https://careerpilot-backend.onrender.com
