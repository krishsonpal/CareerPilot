# Alembic Configuration — CareerPilot
# Docs: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# SQLAlchemy connection URL is injected dynamically from settings
# in alembic/env.py — do NOT set sqlalchemy.url here
sqlalchemy.url =

# Prepend sys.path with this location so backend modules are importable
prepend_sys_path = .

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
